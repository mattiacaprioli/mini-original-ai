services:
  mongo:
    # MongoDB Atlas in locale: include anche Vector Search, che useremo al passo 6.
    image: mongodb/mongodb-atlas-local:latest
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    # Redis: è dove BullMQ salva la coda dei job.
    image: redis:7-alpine
    ports:
      - "6380:6379" # 6380 sul Mac, per non scontrarsi con un eventuale altro Redis
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data: